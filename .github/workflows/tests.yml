name: Run Tests and Parse AHS

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest nic_scripts/ahs_parser/test_ahs.py -v

      - name: Run AHS Parser
        run: python nic_scripts/ahs_parser/Read_AHS.py --file nic_scripts/ahs_parser/AHS_Summary.txt --output HW_Config_Report.txt

      - name: Show Report Output
        run: cat HW_Config_Report.txt

      - name: Commit updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HW_Config_Report.txt
          git commit -m "Auto update HW config report" || echo "No changes to commit"
          git push
